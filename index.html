<!DOCTYPE html>
<html>
<head>
    <title>Social Deduction Game</title>
</head>
<body>

<div id="lobby">
    <h2>Lobby</h2>
    <input id="name" placeholder="Name"><br><br>
    <input id="room" placeholder="Room Code"><br><br>
    <button onclick="createRoom()">Create Room</button>
    <button onclick="joinRoom()">Join Room</button>
    <p id="status"></p>
</div>

<div id="game" style="display:none;">
    <h3 id="roomCode"></h3>

    <div style="display:flex;">
        <!-- Players -->
        <div>
            <h4>Players</h4>
            <ul id="players"></ul>
        </div>

        <!-- Chat -->
        <div style="margin-left:20px;">
            <h4>Chat</h4>
            <div id="chatBox" style="border:1px solid black; height:200px; overflow:auto;"></div>
            <input id="chatInput">
            <button onclick="sendChat()">Send</button>
        </div>

        <!-- Notifications -->
        <div style="margin-left:20px;">
            <h4>Messages</h4>
            <div id="notifications" style="border:1px solid black; height:200px; overflow:auto;"></div>
        </div>

        <!-- Actions -->
        <div style="margin-left:20px;">
            <h4>Actions</h4>
            <div id="actions"></div>
        </div>

        <div id="targetPanel" style="display:none; margin-top:20px; border:1px solid black; padding:10px;">
            <h4 id="targetTitle"></h4>
            <div id="targetContainers" style="display:flex; gap:20px;"></div>
            <br>
            <button onclick="confirmTargets()">Confirm</button>
            <button onclick="cancelTargets()">Cancel</button>
        </div>

        <!-- Clock -->
        <div style="margin-top:20px;">
            <h4>Time</h4>
            <div id="timer"></div>
        </div>
    </div>
</div>

<script>
let ws = new WebSocket("ws://localhost:8000/ws");
let playerName = null;
let currentState = null;

let phaseEndTime = 0;
let currentPhase = "";

let selectedAction = null;
let requiredTargets = 0;
let selectedTargets = [];

setInterval(() => {
    if (!phaseEndTime) return;

    const remaining = Math.max(
        0,
        Math.floor(phaseEndTime - Date.now() / 1000)
    );

    document.getElementById("timer").innerText = 
        currentPhase.toUpperCase() + " - " + remaining + "s";
}, 200);   
    
// =======================
// WebSocket Handling
// =======================

ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "state") {
        currentState = msg.data;
        renderState();
    }

    if (msg.type === "error") {
        document.getElementById("status").innerText = msg.message;
    }
};

// =======================
// Lobby Actions
// =======================

function createRoom() {
    playerName = document.getElementById("name").value;

    ws.send(JSON.stringify({
        type: "create",
        name: playerName
    }));
}

function joinRoom() {
    playerName = document.getElementById("name").value;
    const code = document.getElementById("room").value;

    ws.send(JSON.stringify({
        type: "join",
        name: playerName,
        code: code
    }));
}

// =======================
// Chat
// =======================

function sendChat() {
    const msg = document.getElementById("chatInput").value;

    ws.send(JSON.stringify({
        type: "chat",
        message: msg
    }));

    document.getElementById("chatInput").value = "";
}

// =======================
// Render State
// =======================

function renderState() {
    // Switch UI
    document.getElementById("lobby").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("roomCode").innerText = "Room: " + currentState.code;

    // Players
    const players = document.getElementById("players");
    players.innerHTML = "";
    currentState.players.forEach(p => {
        const li = document.createElement("li");
        li.innerText = p;
        players.appendChild(li);
    });

    // Chat
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";
    currentState.chat.forEach(([p, msg]) => {
        const div = document.createElement("div");
        div.innerText = p + ": " + msg;
        chatBox.appendChild(div);
    });

    // Notifications
    const notifications = document.getElementById("notifications");
    notifications.innerHTML = "";
    currentState.notifications.forEach(([p, msg]) => {
        const div = document.createElement("div");
        div.innerText = p + ": " + msg;
        notifications.appendChild(div);
    })

    phaseEndTime = currentState.phase_end_time;
    currentPhase = currentState.phase;

    // Actions
    renderActions();
}

// =======================
// Dynamic Actions Panel
// =======================

function renderActions() {
    const actionsDiv = document.getElementById("actions");
    actionsDiv.innerHTML = "";

    if (currentState.state === "lobby") {
        if (playerName === currentState.host) {
            const btn = document.createElement("button");
            btn.innerText = "Start Game";
            btn.onclick = () => {
                ws.send(JSON.stringify({ type: "start" }));
            };
            actionsDiv.appendChild(btn);
        } else {
            actionsDiv.innerText = "Waiting for host...";
        }
        return;
    }

    currentState.actions.forEach(action => {
        const btn = document.createElement("button");
        btn.innerText = action;

        btn.onclick = () => {
            const targetsNeeded = currentState.action_targets[action];

            if (targetsNeeded === 0) {
                ws.send(JSON.stringify({
                    type: "action",
                    action: action,
                    targets: []
                }));
                return;
            }
        
            openTargetPanel(action);
        };

        actionsDiv.appendChild(btn);
    });
}

function openTargetPanel(action) {
    selectedAction = action;
    requiredTargets = currentState.action_targets[action];

    if (requiredTargets === 0) return;

    selectedTargets = [];

    document.getElementById("targetPanel").style.display = "block";
    document.getElementById("targetTitle").innerText =
        `Select ${requiredTargets} target(s) for ${action}`;

    const container = document.getElementById("targetContainers");
    container.innerHTML = "";

    // Create one column per target
    for (let i = 0; i < requiredTargets; i++) {
        const col = document.createElement("div");

        currentState.players.forEach(player => {
            const btn = document.createElement("button");
            btn.innerText = player;

            btn.onclick = () => {
                selectedTargets[i] = player;
                highlightSelection(col, player);
            };

            col.appendChild(btn);
            col.appendChild(document.createElement("br"));
        });

        container.appendChild(col);
    }
}

function highlightSelection(container, player) {
    Array.from(container.children).forEach(child => {
        if (child.tagName === "BUTTON") {
            child.style.backgroundColor =
                (child.innerText === player) ? "lightgreen" : "";
        }
    });
}

function confirmTargets() {
    if (selectedTargets.length < requiredTargets || selectedTargets.includes(undefined)) {
        alert("Select all targets first");
        return;
    }

    ws.send(JSON.stringify({
        type: "action",
        action: selectedAction,
        targets: selectedTargets
    }));

    closeTargetPanel();
}

function cancelTargets() {
    closeTargetPanel();
}

function closeTargetPanel() {
    document.getElementById("targetPanel").style.display = "none";
    selectedAction = null;
    selectedTargets = [];
}
</script>

</body>
</html>
